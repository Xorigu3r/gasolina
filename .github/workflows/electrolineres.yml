# Actualitza cada dia els punts de recàrrega (data/ev/) a partir del fitxer oficial de la DGT.
# Si les dades no han canviat, no fa cap commit.
name: Punts de recàrrega

on:
  schedule:
    - cron: "40 9 * * *"     # cada dia a les 9:40 UTC (la DGT el publica cap a les 10:15 hora d'aquí)
  workflow_dispatch:          # també es pot llançar a mà: Actions → Punts de recàrrega → Run workflow

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera data/ev
        run: python -I eines/genera_electrolineres.py
      - name: Desa si ha canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ev
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -m "Punts de recàrrega: dades de la DGT del $(date -u +%Y-%m-%d)"
          git push
